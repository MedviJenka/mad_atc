[project]
name = "mad-atc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "medvijenia@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.14",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.5",
    "livekit-agents>=1.6.9",
    "structlog>=25.5.0",
]

[project.scripts]
mad-atc = "src:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
